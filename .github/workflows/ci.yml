name: ci

on:
  push:
    branches: [main, release/*]
  pull_request:
    branches: [main, release/*]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

      # The generated tables are committed, so a stale checkout would silently
      # ship different data than data/*.tsv describes.
      - name: Generated tables are up to date
        run: |
          npm run data:build
          git diff --exit-code -- src/generated

      - name: CLI runs from the built bundle
        run: |
          node dist/cli.js 信頼してる
          echo 学校 | node dist/cli.js
          node dist/cli.js --version

  runtimes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - uses: oven-sh/setup-bun@v2

      # The library targets Web standards only, so every runtime must be able
      # to import the same bundle.
      - name: Deno
        run: deno eval --no-lock "const { galjp } = await import('./dist/index.js'); if (galjp('信頼してる') !== 'ｲ言束頁Ｕτゑ') Deno.exit(1); console.log('deno ok');"
      - name: Bun
        run: bun -e "const { galjp } = await import('./dist/index.js'); if (galjp('信頼してる') !== 'ｲ言束頁Ｕτゑ') process.exit(1); console.log('bun ok');"
      - name: Node (ESM and CJS)
        run: |
          node -e "import('./dist/index.js').then(({galjp}) => { if (galjp('信頼してる') !== 'ｲ言束頁Ｕτゑ') process.exit(1); console.log('esm ok'); })"
          node -e "const {galjp} = require('./dist/index.cjs'); if (galjp('信頼してる') !== 'ｲ言束頁Ｕτゑ') process.exit(1); console.log('cjs ok');"
