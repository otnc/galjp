name: 🈁 変換結果の報告
description: 特定の文字の変換結果がおかしい、または変換されない
labels: [conversion]
body:
  - type: markdown
    attributes:
      value: |
        変換結果が間違っている、あるいはもっと良くできると思う場合に使ってください。
        変換されずに残ってしまう漢字、読みにくい分割、日本語として不自然な異体字への
        置換などが該当します。

        `galjp --explain <text>` を使うと、各文字がどの経路で変換されたかと途中経過が
        表示されるので、原因の特定に役立ちます。
  - type: input
    attributes:
      label: 入力
      placeholder: 学校
    validations:
      required: true
  - type: input
    attributes:
      label: galjp の変換結果
      placeholder: 學木交
    validations:
      required: true
  - type: input
    attributes:
      label: 期待する結果
      placeholder: 分からない場合は空欄で構いません。違和感があるという報告だけでも有用です。
  - type: textarea
    attributes:
      label: '`galjp --explain` の出力'
      description: 出力結果を貼り付けてください。自動的にコードブロックとして整形されます。
      render: text
  - type: dropdown
    attributes:
      label: 使用していたオプションは？
      multiple: true
      options:
        - 既定値のまま
        - --split-policy horizontal
        - --split-policy aggressive
        - --no-variant
        - --no-style-standalone
        - その他（下に記載）
  - type: textarea
    attributes:
      label: その他の情報
